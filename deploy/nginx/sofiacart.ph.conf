# SofiaCart — host nginx for sofiacart.ph behind Cloudflare (see DEPLOYMENT.md).
#
# Install: /etc/nginx/sites-available/sofiacart.ph -> symlink into sites-enabled.
# Requires:
#   /etc/ssl/sofiacart/origin.pem + origin.key   Cloudflare Origin CA certificate for
#                                                sofiacart.ph and *.sofiacart.ph
#   /etc/nginx/snippets/sofiacart-ssl.conf       TLS settings (sofiacart-ssl.conf in this folder)
#   /etc/nginx/conf.d/cloudflare-realip.conf     Cloudflare IP ranges (generated, DEPLOYMENT.md)
#
#   sofiacart.ph            -> sofiacart-frontend         (merchants + Super Admin)   127.0.0.1:3000
#   api.sofiacart.ph        -> sofiacart-backend          (admin/merchant API)        127.0.0.1:8000
#   store-api.sofiacart.ph  -> sofiacart-website-backend  (customer API)              127.0.0.1:8001
#   <store>.sofiacart.ph    -> sofiacart-website          (each store's shop)         127.0.0.1:3001
#
# Exact server names win over the *.sofiacart.ph wildcard, so platform subdomains never reach the
# stores app. Store slugs that collide with them are refused at merchant registration.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------------------------
# HTTP: everything goes to HTTPS. Unknown hosts (e.g. the bare IP) get no response.
# ---------------------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name sofiacart.ph *.sofiacart.ph;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------------------------

# Refuse TLS for hosts that are not ours (scanners hitting the IP).
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sofiacart.ph;
    include snippets/sofiacart-ssl.conf;
    return 301 https://sofiacart.ph$request_uri;
}

# Merchant platform + Super Admin (sofiacart-frontend)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sofiacart.ph;
    include snippets/sofiacart-ssl.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Admin/merchant API (sofiacart-backend). Merchant registration uploads several files at once.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sofiacart.ph;
    include snippets/sofiacart-ssl.conf;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_read_timeout 120s;
    }
}

# Customer API (sofiacart-website-backend)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name store-api.sofiacart.ph;
    include snippets/sofiacart-ssl.conf;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
        proxy_read_timeout 120s;
    }
}

# Every store's shop (sofiacart-website). The app reads the Host header to pick the store and shows
# "Store not found" for subdomains without a live store.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.sofiacart.ph;
    include snippets/sofiacart-ssl.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
