# SofiaCart TLS settings, included by every HTTPS server in sofiacart.ph.conf.
# Install as /etc/nginx/snippets/sofiacart-ssl.conf. Server-level, so it overrides Ubuntu's
# http-level defaults in nginx.conf without "duplicate directive" errors.
ssl_certificate     /etc/ssl/sofiacart/origin.pem;
ssl_certificate_key /etc/ssl/sofiacart/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
server_tokens       off;
