# TLS settings for the store subdomains (*.sofiacart.ph), included by the stores server block.
# Install as /etc/nginx/snippets/sofiacart-ssl-stores.conf.
#
# Cloudflare: the Origin certificate already covers *.sofiacart.ph, so this matches sofiacart-ssl.conf.
# Let's Encrypt: point these two lines at the wildcard certificate instead, e.g.
#   /etc/letsencrypt/live/sofiacart.ph-0001/fullchain.pem and privkey.pem (see DEPLOYMENT.md, Appendix A).
ssl_certificate     /etc/ssl/sofiacart/origin.pem;
ssl_certificate_key /etc/ssl/sofiacart/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
server_tokens       off;
